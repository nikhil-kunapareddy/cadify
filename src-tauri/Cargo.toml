[package]
name = "cadify"
version = "0.1.0"
description = "CADify — AI-powered engineering drawing to 3D CAD conversion"
authors = ["CADify"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"

[lib]
name = "cadify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Build scripts and proc-macro dylibs must not be stripped: the macOS loader
# rejects stripped proc-macro dylibs ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
